
<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sebrisat ERP Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
            animation: {
              'ripple': 'ripple 0.6s linear',
              'slide-up': 'slideUp 0.3s ease-out'
            },
            keyframes: {
              ripple: { '0%': { transform: 'scale(0)', opacity: '0.4' }, '100%': { transform: 'scale(4)', opacity: '0' } },
              slideUp: { '0%': { transform: 'translateY(100%)' }, '100%': { transform: 'translateY(0)' } }
            }
          }
        }
      }
    </script>
    <style>
      :root { --ion-safe-area-top: env(safe-area-inset-top); --ion-safe-area-bottom: env(safe-area-inset-bottom); }
      body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow-x: hidden; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      
      /* Black & White High Contrast Mode */
      .bw-mode { filter: grayscale(100%) contrast(1.1); }
      .dark.bw-mode { filter: grayscale(100%) contrast(1.3) brightness(0.9); }

      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; }
        .bg-white, .bg-slate-50, .bg-indigo-600 { background: white !important; color: black !important; border: 1px solid #eee !important; }
        .shadow-sm, .shadow-xl, .shadow-2xl { box-shadow: none !important; }
      }

      input[type="date"] { position: relative; }
      input[type="date"]::-webkit-calendar-picker-indicator {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        width: auto; height: auto; color: transparent; background: transparent; cursor: pointer;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.4",
    "react-dom": "https://esm.sh/react-dom@19.2.4",
    "react-dom/client": "https://esm.sh/react-dom@19.2.4/client",
    "recharts": "https://esm.sh/recharts@3.7.0?deps=react@19.2.4,react-dom@19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@0.463.0?deps=react@19.2.4",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2?deps=jspdf@2.5.1",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?deps=react@19.2.4,react-dom@19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
